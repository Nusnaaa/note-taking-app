[workspace]
members = ["core", "bridge"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
thiserror = "2.0.17"
sha2 = "0.10.9"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
rand = "0.8.5"
zeroize = "1.8.2"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
